services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warsaw_ideas
      POSTGRES_USER: warsaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warsaw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warsaw -d warsaw_ideas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://warsaw:${POSTGRES_PASSWORD:-warsaw}@db:5432/warsaw_ideas
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./backend:/app
      - ./warsaw_properties.geojson:/data/warsaw_properties.geojson:ro

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
